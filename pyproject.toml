[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xocto"
version = "10.0.0"
requires-python = ">=3.10"
description = "Kraken Technologies Python service utilities"
readme = "README.md"
authors = [
  {name = "Kraken Technologies", email = "talent@octopus.energy"},
]
maintainers = [
  {name = "Kraken Technologies", email = "talent@octopus.energy"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
license = "MIT"
dependencies = [
  "django>=5.2,<7",
  "duckdb==1.*",
  # `fastapi` is required for `compat-v2` of `pact-python`.
  "fastapi~=0.136",
  "openpyxl~=3.1",
  "pact-python[compat-v2]~=3.0",
  "pandas>=1.5.3,<3",
  "pyarrow>=11.0.0,<26",
  "python-dateutil~=2.8",
  "python-magic~=0.4",
  "pytz",
  "structlog>=20.2.0,<27",
  "typing-extensions~=4.12",
  # `uvicorn` is required for `compat-v2` of `pact-python`.
  "uvicorn~=0.38",
  "xlrd~=2.0",
]

[dependency-groups]
dev = [
  "boto3==1.43.95",
  "boto3-stubs[boto3,s3]==1.43.95",
  "botocore==1.43.95",
  "hypothesis==6.168.0",
  "moto[s3]==5.2.3",
  "mypy==2.3.1",
  "numpy==2.2.6",
  "pre-commit~=4.6",
  "psycopg2~=2.9",
  "pyarrow-stubs==20.0.0.20260819",
  "pytest==9.1.1",
  "pytest-benchmark==5.3.0",
  "pytest-django==4.14.0",
  "pytest-mock==3.15.1",
  "ruff==0.16.8",
  "time-machine==3.5.1",
  "twine==7.0.0",
  "types-openpyxl==3.1.5.20260827",
  "types-python-dateutil==2.9.0.20260807",
  "types-pytz==2026.3.1.20260727",
  "types-requests==2.33.0.20260906",
  "wheel==0.48.0",
]
docs = [
  "myst-parser==2.0.0",
  "sphinx==7.2.6",
  "sphinx-rtd-theme==2.0.0",
  "sphinxcontrib-serializinghtml==1.1.10",
]

[tool.uv]
# Keep dependency-group support consistent across local and CI environments.
required-version = ">=0.10.0"

[project.urls]
changelog = "https://github.com/octoenergy/xocto/blob/main/CHANGELOG.md"
documentation = "https://xocto.readthedocs.io"
issues = "https://github.com/octoenergy/xocto/issues"

[tool.setuptools.packages.find]
include = ["xocto*"]
namespaces = false

[tool.setuptools.package-data]
"xocto" = ["py.typed"]

[tool.mypy]
files = ["."]
exclude = [
  '^benchmarks/',
  '^build/',
  '^dist/',
  '^docs/',
]
strict = true
disallow_subclassing_any = false
warn_return_any = false
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "unused-awaitable",
]
warn_unreachable = true

[[tool.mypy.overrides]]
# Don't force test functions to include types.
module = [
  "tests.*",
]
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# Ignore errors from packages that don't have type annotations.
module = [
  "django.*",
  "moto.*",
  "pandas.*",
  "xlrd.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line too long
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__ files as these are convenience imports
"**/__init__.py" = [ "F401" ]

[tool.ruff.lint.isort]
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "project",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"project" = [
    "xocto",
    "tests",
]

[tool.pytest]
# Convert some warning types into errors but ignore some others that we
# can't/won't fix right now.
#
# Note:
# - Each line is a colon-separated string.
# - The first part is what to do with the warning - error or ignore.
# - The second part is a regex that must match the start of the warning message.
# - The third part is the warning class name.
# - The fourth part is a regex that must match the module triggering the error.
# - The order matters. These rules get applied with the bottom rule first.
#   Hence the rules ignoring deprecation warnings must by below the rule that converts
#   DeprecationWarnings into errors.
filterwarnings = [
    "error",
    "ignore:Bundled (pact-plugin-cli|pact-stub-server|pact_mock_server_cli|pact_verifier_cli) binary not found; using system installation instead:RuntimeWarning:pact_cli",
    "ignore:The `pact.v2` module is deprecated:DeprecationWarning",
]

DJANGO_SETTINGS_MODULE = "tests.settings"

# Test modules must have be named this way.
python_files = ["test_*.py", "benchmark_*.py"]
python_functions = ["test_*", "benchmark_*"]
python_classes = ["Test*", "Benchmark*"]

addopts = [
    # Use short tracebacks.
    # https://docs.pytest.org/en/9.0.x/how-to/output.html#modifying-python-traceback-printing
    "--tb=short",
    # Show names of tests being run.
    "--verbose",
    # Disable Django's migrations and create the database by inspecting models instead.
    # https://github.com/pytest-dev/pytest-django/blob/v4.8.0/docs/database.rst#L129
    "--nomigrations",
    # Don't remove test database after each test run so it can be re-used next time.
    # https://github.com/pytest-dev/pytest-django/blob/v4.8.0/docs/database.rst#L90
    "--reuse-db",
    # Detect whether to print colored output.
    "--color=auto",
    # Capture all output written to the STDOUT and STDERR file descriptors.
    # https://docs.pytest.org/en/9.0.x/how-to/capture-stdout-stderr.html#default-stdout-stderr-stdin-capturing-behaviour
    "--capture=fd",
]
